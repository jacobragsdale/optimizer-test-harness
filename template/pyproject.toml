[project]
name = "app-test-harness"
version = "0.1.0"
description = "LLM-driven test harness for a web app: compile BA workbooks into specs, run them against QA with automatic revert, report back in Excel."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
oracle = ["oracledb>=3"]
mssql = ["pyodbc>=5"]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "harness"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not integration'"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
markers = ["integration: needs a real database or network; excluded from the default run"]

[tool.ruff]
line-length = 200
required-version = ">=0.16.0"
force-exclude = true
show-fixes = true
unsafe-fixes = false

[tool.ruff.lint]
extend-select = [
    "E4", "E7", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "N", "A", "SLF", "T20", "INP", "TID", "ERA", "EM",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
    "LOG", "G", "ARG", "PGH", "RSE", "RET502", "RET503", "PLW", "C90", "PERF", "ASYNC", "FAST", "PD",
]
ignore = [
    "ASYNC109",  # Allow deliberate timeout parameters in async APIs.
    "S",  # Do not run flake8-bandit; its findings are noise outside audited code.
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["SLF001", "INP001"]
"**/test_*.py" = ["SLF001", "INP001"]
"**/conftest.py" = ["SLF001", "INP001"]
"harness/cli.py" = ["T20"]  # stdout is the CLI's product, not a log

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-generic-narrowing = true

[tool.ty.terminal]
error-on-warning = true
